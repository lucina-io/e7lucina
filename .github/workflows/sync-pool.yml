name: Sync hero & artifact pool

on:
  schedule:
    # Daily, a few hours after the usual Thursday 03:00–09:00 UTC maintenance.
    # Daily (not weekly) so date-gated banners and late CeciliaBot data get picked up.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync pool
        id: sync
        run: node scripts/sync-pool.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        if: steps.sync.outputs.added != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add app/heroes.js app/artifacts.js
          git commit -m "added ${{ steps.sync.outputs.added }}"
          git push
